name: Infra
run-name: Infra ${{ github.event.workflow_run.head_commit.message || format('manual by {0}', github.actor) }}

on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      modules: ${{ steps.outcome.outputs.modules }}
      dev: ${{ steps.outcome.outputs.dev }}
      qa: ${{ steps.outcome.outputs.qa }}
      prod: ${{ steps.outcome.outputs.prod }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'workflow_run'
        with:
          filters: |
            modules:
              - 'modules/**'
            dev:
              - 'environments/dev/**'
              - '!environments/dev/image.tfvars'
              - 'modules/**'
            qa:
              - 'environments/qa/**'
              - '!environments/qa/image.tfvars'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - '!environments/prod/image.tfvars'
              - 'modules/**'

      - name: Compute outcome
        id: outcome
        run: |
          # On manual dispatch, force all envs to run — the operator is
          # explicitly asking to redeploy infra. On workflow_run, use the
          # path-filter results from above (which exclude image.tfvars
          # since those changes are handled by image.yml).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "modules=false" >> $GITHUB_OUTPUT
            echo "dev=true" >> $GITHUB_OUTPUT
            echo "qa=true" >> $GITHUB_OUTPUT
            echo "prod=true" >> $GITHUB_OUTPUT
          else
            echo "modules=${{ steps.filter.outputs.modules }}" >> $GITHUB_OUTPUT
            echo "dev=${{ steps.filter.outputs.dev }}" >> $GITHUB_OUTPUT
            echo "qa=${{ steps.filter.outputs.qa }}" >> $GITHUB_OUTPUT
            echo "prod=${{ steps.filter.outputs.prod }}" >> $GITHUB_OUTPUT
          fi

  validate-modules:
    name: Validate modules
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.modules == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: modules

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: modules

      - name: TFLint
        run: tflint --recursive
        working-directory: modules

  validate-dev:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.dev == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: dev

  validate-qa:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.qa == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: qa

  validate-prod:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.prod == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: prod

  plan-dev:
    needs: [validate-dev]
    if: needs.validate-dev.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-qa:
    needs: [validate-qa]
    if: needs.validate-qa.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-prod:
    needs: [validate-prod]
    if: needs.validate-prod.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-dev:
    concurrency:
      group: terraform-ops-dev
      cancel-in-progress: false
    needs: [plan-dev]
    if: needs.plan-dev.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-qa:
    concurrency:
      group: terraform-ops-qa
      cancel-in-progress: false
    needs: [plan-qa]
    if: needs.plan-qa.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-prod:
    concurrency:
      group: terraform-ops-prod
      cancel-in-progress: false
    needs: [plan-prod]
    if: needs.plan-prod.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
