name: Infra
run-name: Infra ${{ github.event.workflow_run.head_commit.message || format('manual by {0}', github.actor) }}

on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Step 1: validate shared modules first. Gates all per-env work.
  validate-modules:
    name: Validate modules
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: modules

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: modules

      - name: TFLint
        run: tflint --recursive
        working-directory: modules

  # Step 2: per-env validate runs in parallel once modules are clean.
  validate-dev:
    needs: [validate-modules]
    if: needs.validate-modules.result == 'success'
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: dev

  validate-qa:
    needs: [validate-modules]
    if: needs.validate-modules.result == 'success'
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: qa

  validate-prod:
    needs: [validate-modules]
    if: needs.validate-modules.result == 'success'
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: prod

  # Step 3: per-env plan, each gated on its own validate.
  plan-dev:
    needs: [validate-dev]
    if: needs.validate-dev.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-qa:
    needs: [validate-qa]
    if: needs.validate-qa.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-prod:
    needs: [validate-prod]
    if: needs.validate-prod.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # Step 4: per-env apply, each gated on its own plan.
  apply-dev:
    concurrency:
      group: terraform-ops-dev
      cancel-in-progress: false
    needs: [plan-dev]
    if: needs.plan-dev.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-qa:
    concurrency:
      group: terraform-ops-qa
      cancel-in-progress: false
    needs: [plan-qa]
    if: needs.plan-qa.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-prod:
    concurrency:
      group: terraform-ops-prod
      cancel-in-progress: false
    needs: [plan-prod]
    if: needs.plan-prod.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
