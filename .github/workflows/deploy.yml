name: Deploy
run-name: Deploy ${{ github.event.workflow_run.head_commit.message }}

on:
  workflow_run:
    workflows: ["Version"]
    types: [completed]
    branches: [main]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      modules: ${{ steps.filter.outputs.modules }}
      dev: ${{ steps.filter.outputs.dev }}
      qa: ${{ steps.filter.outputs.qa }}
      prod: ${{ steps.filter.outputs.prod }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            modules:
              - 'modules/**'
            dev:
              - 'environments/dev/**'
              - 'modules/**'
            qa:
              - 'environments/qa/**'
              - 'modules/**'
            prod:
              - 'environments/prod/**'
              - 'modules/**'

  validate-modules:
    name: Validate modules
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.modules == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: modules

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: modules

      - name: TFLint
        run: tflint --recursive
        working-directory: modules

  validate-dev:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.dev == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: dev

  validate-qa:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.qa == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: qa

  validate-prod:
    needs: [detect-changes, validate-modules]
    if: |
      always() &&
      needs.detect-changes.outputs.prod == 'true' &&
      (needs.validate-modules.result == 'success' || needs.validate-modules.result == 'skipped')
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: prod

  plan-dev:
    needs: [validate-dev]
    if: needs.validate-dev.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-qa:
    needs: [validate-qa]
    if: needs.validate-qa.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-prod:
    needs: [validate-prod]
    if: needs.validate-prod.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-dev:
    concurrency:
      group: terraform-ops-dev
      cancel-in-progress: false
    needs: [plan-dev]
    if: needs.plan-dev.result == 'success'
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-qa:
    concurrency:
      group: terraform-ops-qa
      cancel-in-progress: false
    needs: [apply-dev, plan-qa]
    if: |
      always() &&
      needs.plan-qa.result == 'success' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  apply-prod:
    concurrency:
      group: terraform-ops-prod
      cancel-in-progress: false
    needs: [apply-qa, plan-prod]
    if: |
      always() &&
      needs.plan-prod.result == 'success' &&
      (needs.apply-qa.result == 'success' || needs.apply-qa.result == 'skipped')
    uses: ./.github/workflows/_apply-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
