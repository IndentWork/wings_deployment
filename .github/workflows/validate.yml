name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  # validate-modules runs in parallel — static quality check on the
  # shared modules. It does not gate the per-env chain.
  validate-modules:
    name: Validate modules
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: modules

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint Init
        run: tflint --init
        working-directory: modules

      - name: TFLint
        run: tflint --recursive
        working-directory: modules

  validate-dev:
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: dev

  validate-qa:
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: qa

  validate-prod:
    uses: ./.github/workflows/_validate-env.yml
    with:
      environment: prod

  plan-dev:
    needs: [validate-dev]
    if: needs.validate-dev.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: dev
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-qa:
    needs: [validate-qa]
    if: needs.validate-qa.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: qa
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  plan-prod:
    needs: [validate-prod]
    if: needs.validate-prod.result == 'success'
    uses: ./.github/workflows/_plan-env.yml
    with:
      environment: prod
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
