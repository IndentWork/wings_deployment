name: Apply Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to apply (dev, qa, prod)"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  apply:
    name: Apply ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check environment is enabled
        id: check
        run: |
          enabled=$(python3 -c "
          import tomllib
          with open('config.toml', 'rb') as f:
              c = tomllib.load(f)
          print('true' if '${{ inputs.environment }}' in c['environments']['enabled'] else 'false')
          ")
          echo "enabled=$enabled" >> $GITHUB_OUTPUT

      - uses: azure/login@v2
        if: steps.check.outputs.enabled == 'true'
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Purge soft-deleted Key Vault
        if: steps.check.outputs.enabled == 'true' && inputs.environment != 'prod'
        run: |
          az keyvault purge --name kv-wings-${{ inputs.environment }} --location southindia || true

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.enabled == 'true'

      - name: Terraform Init
        if: steps.check.outputs.enabled == 'true'
        run: terraform init -backend-config=../../bootstrap/backend.hcl
        working-directory: environments/${{ inputs.environment }}

      - name: Download Plan
        if: steps.check.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.environment }}-tfplan
          path: environments/${{ inputs.environment }}

      - name: Terraform Apply
        if: steps.check.outputs.enabled == 'true'
        run: terraform apply ${{ inputs.environment }}.tfplan
        working-directory: environments/${{ inputs.environment }}
