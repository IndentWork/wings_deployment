name: Image Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy image to (dev, qa, prod)"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

# Image deployment is now a single az command: set the new image on the
# production web app. App Service restarts the container automatically with
# the new image. No staging slot, no health-check loop, no swap — see
# docs/pipeline-architecture.md. This matches the canonical Microsoft
# reference template (Azure-Samples/azure-django-postgres-flexible-appservice)
# which also has no slot.

jobs:
  deploy:
    name: Image ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check environment is enabled
        id: check
        run: |
          enabled=$(python3 -c "
          import tomllib
          with open('config.toml', 'rb') as f:
              c = tomllib.load(f)
          print('true' if '${{ inputs.environment }}' in c['environments']['enabled'] else 'false')
          ")
          echo "enabled=$enabled" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.enabled == 'true'

      - name: Terraform Init
        if: steps.check.outputs.enabled == 'true'
        run: terraform init -backend-config=../../bootstrap/backend.hcl
        working-directory: environments/${{ inputs.environment }}

      - name: Read terraform outputs
        if: steps.check.outputs.enabled == 'true'
        id: tf
        run: |
          version=$(terraform output -raw image_version)
          app_name=$(terraform output -raw web_app_name)
          rg=$(terraform output -raw resource_group_name)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "app_name=$app_name" >> $GITHUB_OUTPUT
          echo "rg=$rg" >> $GITHUB_OUTPUT
          echo "Resolved: app=$app_name rg=$rg version=$version"
        working-directory: environments/${{ inputs.environment }}

      - uses: azure/login@v2
        if: steps.check.outputs.enabled == 'true'
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Set container image on production
        if: steps.check.outputs.enabled == 'true'
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
          IMAGE: acriwwings01.azurecr.io/wings:${{ steps.tf.outputs.version }}
        run: |
          az webapp config container set \
            --name "$APP_NAME" --resource-group "$RG" \
            --container-image-name "$IMAGE"
          echo "Set $APP_NAME to $IMAGE. App Service will restart the container."
