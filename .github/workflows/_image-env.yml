name: Image Environment

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy image to (dev, qa, prod)"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  deploy:
    name: Image ${{ inputs.environment }}
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Check environment is enabled
        id: check
        run: |
          enabled=$(python3 -c "
          import tomllib
          with open('config.toml', 'rb') as f:
              c = tomllib.load(f)
          print('true' if '${{ inputs.environment }}' in c['environments']['enabled'] else 'false')
          ")
          echo "enabled=$enabled" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3
        if: steps.check.outputs.enabled == 'true'

      - name: Terraform Init
        if: steps.check.outputs.enabled == 'true'
        run: terraform init -backend-config=../../bootstrap/backend.hcl
        working-directory: environments/${{ inputs.environment }}

      - name: Read terraform outputs
        if: steps.check.outputs.enabled == 'true'
        id: tf
        run: |
          version=$(terraform output -raw image_version)
          app_name=$(terraform output -raw web_app_name)
          rg=$(terraform output -raw resource_group_name)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "app_name=$app_name" >> $GITHUB_OUTPUT
          echo "rg=$rg" >> $GITHUB_OUTPUT
          echo "Resolved: app=$app_name rg=$rg version=$version"
        working-directory: environments/${{ inputs.environment }}

      - uses: azure/login@v2
        if: steps.check.outputs.enabled == 'true'
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}"}'

      - name: Detect deploy mode
        if: steps.check.outputs.enabled == 'true'
        id: mode
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
          INTENDED: acriwwings01.azurecr.io/wings:${{ steps.tf.outputs.version }}
        run: |
          # Use '#' as the sed delimiter so the literal '|' in 'DOCKER|'
          # doesn't need escaping. The previous form `s|^DOCKER\|||` was
          # interpreted by GNU sed ERE as `^DOCKER|empty`, stripping only
          # 'DOCKER' and leaving the '|' behind — breaking mode=skip.
          current=$(az webapp config container show \
            --name "$APP_NAME" --resource-group "$RG" \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv 2>/dev/null || echo "")

          current_image=$(echo "$current" | sed -E 's#^DOCKER\|##; s#^https?://##')

          current_staging=$(az webapp config container show \
            --name "$APP_NAME" --resource-group "$RG" \
            --slot staging \
            --query "[?name=='DOCKER_CUSTOM_IMAGE_NAME'].value | [0]" -o tsv 2>/dev/null || echo "")

          current_staging_image=$(echo "$current_staging" | sed -E 's#^DOCKER\|##; s#^https?://##')

          echo "Current production image: ${current_image:-<none>}"
          echo "Current staging image:    ${current_staging_image:-<none>}"
          echo "Intended image:           $INTENDED"

          if [ -z "$current_image" ]; then
            echo "mode=bootstrap" >> $GITHUB_OUTPUT
            echo "First-deploy bootstrap: set image on production directly"
          elif [ -z "$current_staging_image" ]; then
            echo "mode=bootstrap-staging" >> $GITHUB_OUTPUT
            echo "Staging slot is new: set image on both slots directly, skip health check"
          elif [ "$current_image" = "$INTENDED" ]; then
            echo "mode=skip" >> $GITHUB_OUTPUT
            echo "Production already runs the intended image; nothing to deploy"
          else
            echo "mode=swap" >> $GITHUB_OUTPUT
            echo "Blue-green deploy: staging → swap"
          fi

      - name: Bootstrap deploy — set production image directly
        if: steps.check.outputs.enabled == 'true' && steps.mode.outputs.mode == 'bootstrap'
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
          IMAGE: acriwwings01.azurecr.io/wings:${{ steps.tf.outputs.version }}
        run: |
          az webapp config container set \
            --name "$APP_NAME" --resource-group "$RG" \
            --container-image-name "$IMAGE"

      - name: Bootstrap staging — set image on both slots directly
        if: steps.check.outputs.enabled == 'true' && steps.mode.outputs.mode == 'bootstrap-staging'
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
          IMAGE: acriwwings01.azurecr.io/wings:${{ steps.tf.outputs.version }}
        run: |
          az webapp config container set \
            --name "$APP_NAME" --resource-group "$RG" \
            --slot staging \
            --container-image-name "$IMAGE"
          az webapp config container set \
            --name "$APP_NAME" --resource-group "$RG" \
            --container-image-name "$IMAGE"

      - name: Blue-green — set staging image
        if: steps.check.outputs.enabled == 'true' && steps.mode.outputs.mode == 'swap'
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
          IMAGE: acriwwings01.azurecr.io/wings:${{ steps.tf.outputs.version }}
        run: |
          az webapp config container set \
            --name "$APP_NAME" --resource-group "$RG" \
            --slot staging \
            --container-image-name "$IMAGE"

      - name: Blue-green — health check staging
        if: steps.check.outputs.enabled == 'true' && steps.mode.outputs.mode == 'swap'
        env:
          STAGING_URL: https://${{ steps.tf.outputs.app_name }}-staging.azurewebsites.net
        run: |
          for i in $(seq 1 30); do
            code=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" "$STAGING_URL/healthz/ready" || echo "000")
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Staging healthy"
              exit 0
            fi
            sleep 10
          done
          echo "Staging never returned 200 on /healthz/ready"
          exit 1

      - name: Blue-green — swap staging into production
        if: steps.check.outputs.enabled == 'true' && steps.mode.outputs.mode == 'swap'
        env:
          APP_NAME: ${{ steps.tf.outputs.app_name }}
          RG: ${{ steps.tf.outputs.rg }}
        run: |
          az webapp deployment slot swap \
            --name "$APP_NAME" --resource-group "$RG" \
            --slot staging --target-slot production
